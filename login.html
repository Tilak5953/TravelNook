<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | TravelNook</title>
    <meta name="description" content="Access your TravelNook account to manage tour bookings, travel wishlists, and customized itineraries.">
    
    <!-- CSS Links -->
    <link rel="stylesheet" href="./style.css">
    
    <!-- Icon Fonts (FontAwesome 6) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Page Loading Cover -->
    <div class="page-loading-cover" id="loading-cover">
        <div class="spinner"></div>
    </div>

    <!-- Auth Layout Page Wrapper -->
    <section class="auth-page">
        <div class="auth-card reveal">
            <!-- Brand Logo -->
            <div class="auth-header">
                <a href="./index.html" class="logo" style="justify-content: center; font-size: 2.2rem; margin-bottom: 20px;">
                    <i class="fa-solid fa-paper-plane text-gold"></i> Travel<span>Nook</span>
                </a>
                <h2>Welcome Back</h2>
                <p>Login to access your custom itineraries and wishlists.</p>
            </div>

            <!-- Login Form -->
            <form id="login-form">
                <!-- Email Group -->
                <div class="form-input-group">
                    <label for="login-email">Email Address</label>
                    <i class="fa-regular fa-envelope"></i>
                    <input type="email" id="login-email" class="form-input-control" placeholder="e.g. name@email.com" required autocomplete="off">
                    <span class="form-input-error">Enter a valid email address.</span>
                </div>

                <!-- Password Group -->
                <div class="form-input-group">
                    <label for="login-pwd">Password</label>
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="login-pwd" class="form-input-control" placeholder="••••••••" required autocomplete="off">
                    <i class="fa-regular fa-eye password-toggle" aria-label="Toggle Password Visibility"></i>
                    <span class="form-input-error">Password must be at least 6 characters.</span>
                </div>

                <!-- Auth Options -->
                <div class="auth-options">
                    <label class="checkbox-container">
                        <input type="checkbox" id="login-remember">
                        Remember me
                    </label>
                    <a href="#" class="text-gold" style="font-weight: 500;">Forgot Password?</a>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px;" id="login-submit-btn">Login Account</button>
            </form>

            <!-- Redirect Link -->
            <p class="auth-redirect">Don't have an account? <a href="./signup.html">Create One</a></p>
        </div>
    </section>

    <!-- Scripts -->
    <script src="./script.js"></script>
</body>
</html>
